name: Test and deploy Version 03

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate application modules and teaching content
        run: |
          test -f index.html
          test -f css/styles.css
          test -f css/typography.css
          test -f js/app.js
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          grep -Fq 'The Turkish word “${word}” means “${meaning}”' js/app.js
          grep -Fq '<h2 class="word-large">${esc(word)}</h2>' js/app.js
          ! grep -Fq 'Listen, look, then start practice.' js/app.js
          grep -Fq "turkish-meaning-builder-v03-20260715-r3" sw.js
      - name: Validate referenced media
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path('.')
          text = '\n'.join(p.read_text(encoding='utf-8') for p in root.glob('js/*.js'))
          refs = sorted(set(re.findall(r"(?:audio|images)/[A-Za-z0-9_./-]+", text)))
          missing = [ref for ref in refs if not (root / ref).is_file()]
          if missing:
              raise SystemExit('Missing media files:\n' + '\n'.join(missing))
          print(f'MEDIA_AUDIT_OK: {len(refs)} referenced files')
          PY

  deploy:
    needs: test
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify live Version 03, teaching content, cache and media
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          sleep 10
          curl -fsSL --retry 6 --retry-delay 5 "${SITE_URL}" -o /tmp/index.html
          grep -F 'Turkish Meaning Builder — Version 03' /tmp/index.html
          curl -fsSL --retry 6 --retry-delay 5 "${SITE_URL}js/app.js" -o /tmp/app.js
          grep -F "from'./lessonData.js'" /tmp/app.js
          grep -F 'The Turkish word “${word}” means “${meaning}”' /tmp/app.js
          grep -F '<h2 class="word-large">${esc(word)}</h2>' /tmp/app.js
          if grep -Fq 'Listen, look, then start practice.' /tmp/app.js; then
            echo 'Live site still contains the empty Root Words guide.' >&2
            exit 1
          fi
          curl -fsSL --retry 6 --retry-delay 5 "${SITE_URL}sw.js" -o /tmp/sw.js
          grep -F 'turkish-meaning-builder-v03-20260715-r3' /tmp/sw.js
          curl -fsSL --retry 6 --retry-delay 5 "${SITE_URL}audio/pronunciation_tr_a.mp3" -o /tmp/sample.mp3
          test "$(wc -c < /tmp/sample.mp3)" -gt 1000
          curl -fsSL --retry 6 --retry-delay 5 "${SITE_URL}images/ev.png" -o /tmp/ev.png
          test "$(wc -c < /tmp/ev.png)" -gt 1000
      - name: Record live acceptance
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          printf '# Version 03 Live Acceptance\n\n- Commit: `%s`\n- URL: %s\n- HTML: verified\n- JavaScript module: verified\n- Root Words Laya teaching: verified\n- Root word and meaning display: verified\n- Cache r3: verified\n- Audio file: verified\n- Image file: verified\n' "$GITHUB_SHA" "$SITE_URL" > LIVE_VERIFIED.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LIVE_VERIFIED.md
          git commit -m 'Record live Root Words teaching acceptance'
          git push origin main
